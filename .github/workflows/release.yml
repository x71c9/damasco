name: release

# Publishes a GitHub release when a tag like v0.1.0 is pushed. The tag must
# match the version in Cargo.toml. Before publishing, install.sh installs the
# new archives as root on Ubuntu 24.04, with systemd and AppArmor, and
# upgrades them in place. Started by hand (workflow_dispatch), the workflow
# builds and tests the installation without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# bash -eo pipefail, so that a failing installer is not hidden by tee.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: panel/.node-version
          cache: npm
          cache-dependency-path: panel/package-lock.json

      # Static musl binaries run on any Linux distribution.
      - name: toolchain
        run: |
          sudo apt-get install -y -qq musl-tools
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: package
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: scripts/package ${{ matrix.target }} ${{ matrix.arch }}

      - name: smoke test
        run: |
          tar -xzf dist/alogeno-${{ matrix.arch }}-linux.tar.gz -C dist
          dist/alogeno-${{ matrix.arch }}-linux/alogeno --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alogeno-${{ matrix.arch }}-linux
          path: dist/alogeno-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  install:
    name: install ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum alogeno-*-linux.tar.gz > SHA256SUMS

      - name: install
        run: |
          curl -fsSL "file://$PWD/install.sh" \
            | sudo ALOGENO_BASE_URL="file://$PWD/dist" ALOGENO_DOMAIN=example.com bash \
            | tee install.log
          grep -q 'https://panel.example.com/setup#' install.log

      - name: the panel answers through the socket
        run: |
          curl -fsS -H 'Host: panel.example.com' http://127.0.0.1:4100/api/public \
            | tee /dev/stderr | grep -q '"has_owner":false'
          curl -fsS -o /dev/null -H 'Host: panel.example.com' http://127.0.0.1:4100/

      - name: the sandbox environment passes inside the service
        run: |
          sudo journalctl -u alogeno --no-pager -o cat
          sudo journalctl -u alogeno --no-pager -o cat | grep -q 'environment ready for the sandbox'

      - name: upgrade in place keeps the configuration
        run: |
          sudo sed -i 's/^listen = .*/listen = "127.0.0.1:4100" # kept/' /etc/alogeno/alogeno.toml
          curl -fsSL "file://$PWD/install.sh" \
            | sudo ALOGENO_BASE_URL="file://$PWD/dist" bash \
            | tee upgrade.log
          grep -q 'upgrading' upgrade.log
          grep -q '# kept' /etc/alogeno/alogeno.toml
          curl -fsS -o /dev/null -H 'Host: panel.example.com' http://127.0.0.1:4100/api/public

      - name: a second installation on its own port
        run: |
          curl -fsSL "file://$PWD/install.sh" \
            | sudo ALOGENO_BASE_URL="file://$PWD/dist" ALOGENO_INSTANCE=blog ALOGENO_DOMAIN=blog.example.com bash \
            | tee blog.log
          grep -q 'https://panel.blog.example.com/setup#' blog.log
          curl -fsS -H 'Host: panel.blog.example.com' http://127.0.0.1:4101/api/public \
            | grep -q '"site":"blog.example.com"'
          curl -fsS -H 'Host: panel.example.com' http://127.0.0.1:4100/api/public \
            | grep -q '"site":"example.com"'
          sudo journalctl -u alogeno@blog --no-pager -o cat | grep -q 'environment ready for the sandbox'
          systemctl is-active alogeno-update@blog.path

      - name: an upgrade restarts every installation
        run: |
          curl -fsSL "file://$PWD/install.sh" \
            | sudo ALOGENO_BASE_URL="file://$PWD/dist" ALOGENO_UPGRADE=1 bash 2>&1 \
            | tee all.log
          grep -q 'restarting alogeno.service' all.log
          grep -q 'restarting alogeno@blog.service' all.log
          curl -fsS -o /dev/null -H 'Host: panel.blog.example.com' http://127.0.0.1:4101/api/public

  release:
    name: release
    needs: install
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum alogeno-*-linux.tar.gz > SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release of an older major version (a 1.x fix once 2.0 is out)
        # does not become GitHub's "latest": new installations and the
        # installer's default follow the newest major version.
        run: |
          major="${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName --jq '.[].tagName' \
            | sed -n 's/^v\([0-9][0-9]*\)\..*/\1/p' | sort -n | tail -n 1)
          latest=true
          if [ -n "$newest" ] && [ "$major" -lt "$newest" ]; then
            latest=false
          fi
          echo "major $major, newest published major ${newest:-none}: latest=$latest"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest="$latest" \
            dist/alogeno-*-linux.tar.gz dist/SHA256SUMS install.sh
