[package]
name = "axioma"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.11"
getrandom = "0.4.3"
libc = "0.2.191"
mime_guess = "2.0.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8.14.0"
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "process", "time"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
