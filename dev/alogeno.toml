# Configuration for local development. Browsers and curl resolve *.localhost
# to the loopback address, so no DNS or /etc/hosts entry is needed.

listen = "127.0.0.1:4100"

# Relative to this file: dev/.data
data_dir = ".data"

[hosts]
panel = "panel.localhost"
preview = "preview.localhost"
site = ["site.localhost"]
# Public addresses in development: no reverse proxy, no HTTPS.
scheme = "http"
port = 4100

# Development uses the node and claude already in PATH (shell.nix and the
# local Claude Code installation) instead of downloading them.
[runtimes]
node = "node"
claude = "claude"
